# rights, so finding it yields the maintenance data, not the instance.
vault_cmms_app_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          36663438363033656633623039323436643137353266343961306564613639383430373939666261
          3862343437393539313632373632653834303364653262640a346232346430623262333332616238
          30366665383333613236366139336233313234336164633735366566306261646233326165336366
          3762613961326239630a386163366363306639303761326231333733623837313732343034313663
