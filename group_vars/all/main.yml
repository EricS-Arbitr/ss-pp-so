# xadmin / vault_windows_xadmin_password matches the released
# range-development-ansible convention (the 1.2.x image's local admin and the
# created domain admin share one identity and password). "xadmin" is not a
# substring of its password, so Windows complexity accepts it. The old simspace
# domain account is no longer needed now that every Windows image is 1.2.x.
domain_admin: "xadmin"
domain_admin_password: "{{ vault_windows_xadmin_password }}"
cs_certs:
  - "https://nexus.dev.ng.simspace.lan/repository/ng_raw/certificates/DigiCertHighAssuranceEVRootCA.crt"
  - "https://nexus.dev.ng.simspace.lan/repository/ng_raw/certificates/DigiCertGlobalRootG2.crt"
  - "https://nexus.dev.ng.simspace.lan/repository/ng_raw/certificates/DigiCertAssuredIDRootCA.crt"
ms_cert: "https://nexus.dev.ng.simspace.lan/repository/ng_raw/certificates/MicrosoftIdentityVerificationRootCert2020.crt"

# Upstream proxy configuration
inet_proxy_addr: "10.255.240.1"
inet_proxy_port: "3128"

# Container name for the global DNS simulator (referenced by handlers role)
global_dns_container_name: "is-inet"

# Central syslog collector. All Linux/VyOS/pfSense hosts forward to this IP.
# pp-syslog runs rsyslog listening on UDP+TCP 514 and writes per-host files
# at /var/log/remote/<hostname>/syslog.log.
#
# SPLUNK REMOVED 2026-09-09. Security Onion is the only SIEM on this range.
# The /var/log/remote/ store now feeds nothing -- deliberately. Linux hosts
# already ship their own syslog to SO via the Elastic Agent system
# integration, so relaying the store would land every message in SO twice.
# Devices that CANNOT run an agent (pfSense, VyOS) dual-send: to :514 here
# for the store, and to the Elastic Agent listeners on this host, which
# parse them into SO. See so_fleet_* below.
syslog_server_ip: "172.16.2.9"           # pp-syslog's PP-Services IP


# --- Email service (is-inet Postfix/Dovecot/webmail via `email` role) ------
# Multi-domain mail stack on is-inet. Each entry drives cert generation,
# Postfix config, Dovecot SSL blocks, and a webmail config. Mailboxes are
# provisioned from each domain's `DomainUsers` list (group_vars/voltgrid.yml).
#
# Bare-domain naming (voltgrid.com, outlook.com) — NOT mail.<domain> — so
# webmail login accepts `bob.burke@voltgrid.com` (which is what users
# expect). The email role uses this same string as (a) the CN/SAN on the
# generated TLS cert Dovecot presents, (b) the imap_host/smtp_host in the
# webmail's domain ini file, and (c) the login domain the webmail form
# matches against. Requires bare-domain A records under `global_dns_records`
# below so the container's IMAP client can resolve `voltgrid.com` and
# `outlook.com` to is-inet.
#
# Webmail UI is still accessed via the browser URL http://mail.outlook.com/
# — the prebuilt email container image only has an httpd vhost for that
# name. Login form accepts any configured email_domain regardless of which
# URL you reached it on.
email_domains:
  - name: "voltgrid.com"
  - name: "outlook.com"

# --- Simulated public DNS on is-inet (populated by `global_dns` role) -----
# Every record's `value` must be an IP that traffic can actually reach:
#   - www / billing.voltgrid.com  → pp-external-firewall WAN (75.21.1.1)
#     NAT'd inbound to pp-www (172.16.8.5) — see pp-external-firewall
#     host_vars pfsense_nat_rules
#   - mail.voltgrid.com           → is-inet's primary interface (200.200.200.2)
#     where Postfix/Dovecot listens
#   - mail.outlook.com            → 52.96.223.2, a lo alias is-inet claims
#     for the Microsoft-owned range (per range-dev convention)
#
# Anything pointing at 200.200.200.1 would land on pp-isp-router (a VyOS
# BGP router with no web/mail services) and time out — that value used to
# be here and is intentionally corrected.
global_dns_records:
  # --- voltgrid.com is now DELEGATED, not answered here ---------------------
  # pp-dmz-dns is the public authoritative server for voltgrid.com (role
  # dmz_public_dns). is-inet stub-forwards the zone to it via a top-level
  # forward-zone in unbound.conf (added by the "delegate voltgrid.com" play),
  # so these records MUST NOT be emitted as local-data -- a transparent
  # local-zone would short-circuit the forward and is-inet would keep answering
  # voltgrid.com itself. The public record VALUES now live in
  # roles/dmz_public_dns/defaults (www/billing -> 75.21.1.1, apex/mail ->
  # 52.96.223.2, MX 10 mail.voltgrid.com); keep the two in sync.

  # --- Outlook.com (real MSFT IP that is-inet claims as a lo alias) ---
  - name: ""                              # zone apex A record (bare-domain)
    type: "A"
    value: "52.96.223.2"
    zone: "outlook.com"
  - name: "mail"
    type: "A"
    value: "52.96.223.2"
    zone: "outlook.com"
  - type: "MX"
    priority: 10
    value: "mail.outlook.com"
    zone: "outlook.com"

# The xadmin local account password for every REFRESHED SimSpace Windows image.
# One secret covers all of them: RDP_Windows_10:1.2.4, RDP_Windows_11:1.2.4 and
# RDP_Windows_Server_2022:1.2.5. Used by group_vars/win10.yml, win11.yml and
# winserver2022.yml.
#
# IMAGE VERSION IS THE AXIS, not workstation-versus-server. 1.2.x ships
# `xadmin` with this password; 1.1.0 still ships `simspace` with
# vault_windows_password from vault.yml, which is why the four
# RDP_Windows_Server_2019:1.1.0 hosts stay on group_vars/windows.yml.
#
# ONE VARIABLE, NOT ONE PER TIER. A separate variable for the 2022 tier was
# encrypted from a different password, and all five [winserver2022] hosts --
# pp-dc01, pp-dc02, pp-dcs-ctrl, pp-file, pp-sql -- spent a whole run being
# rejected with "ntlm: the specified credentials were rejected by the server".
# Proven on the range 2026-09-25: `xadmin` plus THIS secret authenticates
# against 1.2.5, and `simspace` does not. Splitting a shared secret per tier to
# guard against a divergence that had not happened cost a deploy and bought
# nothing. If the tiers ever do diverge, split it THEN, against a measurement.
#
# INLINE-VAULTED HERE rather than added to vault.yml, deliberately. It was
# produced with `ansible-vault encrypt_string`, which emits a single encrypted
# value instead of re-encrypting the whole file. Two reasons that matters:
# a ~6-line paste instead of 3KB moving through a chat window, and zero risk of
# corrupting the credentials in vault.yml that already work. It decrypts with
# the same platform-placed /home/simspace/.vault_pass, so it is equivalent at
# run time -- only the packaging differs.
#
# If you later consolidate this into vault.yml, delete it from here in the same
# commit. Two definitions of one variable is a silent precedence puzzle.
vault_windows_xadmin_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          61303261393531363463373439653439386633623835633639353661623331333833343437343733
          3234393962656633333337346162393637613239633462300a313131366562626535653331303663
          37316535633466393038653335386461623034663737376131376361353465623666663135353737
          3332366638663837630a356335383735643333356138623965653837353330383637346131343239
          38633362366638313233643636373666643939306264666466313430366462306566

# --- Mirror fidelity threshold -------------------------------------------
# Ceiling on Zeek's own capture_loss, asserted by playbooks/60-verify.yml.
# 5% is generous for a working mirror; this range sat at ~50% from the day it
# was built because nothing read the file. Lives here rather than in
# roles/vyos_mirror/defaults/ because 60-verify targets [so_sensor] and does
# not include that role.
so_capture_loss_max: 5

# Minimum ACK count before the ratio is believed. A freshly built range emits
# capture_loss entries with single-digit denominators; 6 gaps out of 19 acks is
# 31.6% and means nothing. This guard is why that no longer fails a deploy.
so_capture_loss_min_acks: 200

# Whether exceeding the threshold FAILS the play. False while the ~16% mirror
# loss remains unresolved -- see the task comment in playbooks/60-verify.yml.
# Flip to true once it is fixed, turning this into a regression gate.
so_capture_loss_fatal: false

# --- Boot-time apt/dpkg lock ----------------------------------------------
# Ubuntu runs unattended-upgrades on first boot and holds
# /var/lib/dpkg/lock-frontend for MINUTES. Every apt task before that
# finishes fails outright, and deploy.sh's three attempts fire seconds apart
# so all three lose the same race -- a fresh ss-pp-so controller died in
# 1m22s on 2026-09-10 with all three attempts hitting process 3006
# (unattended-upgr).
#
# 60 x 10s = 10 minutes. Long enough to outlast a first-boot upgrade run,
# short enough that a genuinely stuck lock still fails the deploy rather
# than hanging it.
so_apt_lock_tries: 60
so_apt_lock_delay: 10

# Mask unattended-upgrades on the ansible controller. Automation-managed
# range hosts have no use for it, and on an airgapped range it cannot reach
# anything useful anyway -- all it does is hold the dpkg lock at first boot
# and lose the deploy. Set false to leave the host's own upgrade schedule
# alone (the lock wait above still handles the race, just more slowly).
so_disable_unattended_upgrades: true

# --- CMMS on pp-sql -------------------------------------------------------
