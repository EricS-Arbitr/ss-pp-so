---
# 12-nexus-apt.yml — point NOBLE hosts at the in-platform Nexus apt repo (ng-apt)
# BEFORE the baseline's first apt install, so their role package installs come
# from Nexus (pinned above archive.ubuntu.com) instead of the internet.
#
# NOBLE ONLY, on purpose. ng-apt is a single mixed-release repo (dist=simspace
# holds jammy + noble + plucky debs). On a NOBLE host that is safe: ng-apt's
# highest-version packages are the noble ones, which match the host. On a JAMMY
# host it is NOT: ng-apt's noble packages (e.g. libc6 2.43) outrank jammy's
# (2.35) and apt tries to pull them in, breaking core-lib dependency resolution
# (deploy failure 2026-10-16: apache2 on pp-proxy -> libc-bin needs libc6<2.36).
# Sourcing JAMMY packages from Nexus needs per-release dists in Nexus
# (simspace-jammy / simspace-noble) or a separate ng-apt-jammy repo; until then
# jammy hosts stay on archive.ubuntu.com (via the mgmt proxy).
#
# Imported by site.yml right after 10-mirror (controller-only) and before
# 00-baseline. See roles/nexus_apt.
- name: Nexus apt sourcing — prefer ng-apt on noble hosts
  hosts: malcolm
  gather_facts: true
  become: true
  roles:
    - nexus_apt
  tags:
    - nexus_apt

# Self-heal jammy hosts. The 2026-10-16 run wrote the ng-apt source + pin to the
# jammy [linux] hosts before we learned the mixed-release repo breaks jammy apt;
# strip it so their apt is back to archive.ubuntu.com only. Idempotent no-op on a
# host that never had it (malcolm is not in [linux], so it is untouched here).
- name: Nexus apt sourcing — ensure ng-apt is OFF jammy hosts (mixed-repo unsafe there)
  hosts: linux
  gather_facts: false
  become: true
  tags:
    - nexus_apt
  tasks:
    - name: Remove any ng-apt source / pin / proxy drop-in
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/nexus.list
        - /etc/apt/preferences.d/99-nexus-ng-apt
        - /etc/apt/apt.conf.d/99nexus
      register: nexus_apt_cleanup

    - name: Refresh apt cache after removing ng-apt # noqa: no-handler
      ansible.builtin.apt:
        update_cache: true
        lock_timeout: 600
      when: nexus_apt_cleanup is changed
