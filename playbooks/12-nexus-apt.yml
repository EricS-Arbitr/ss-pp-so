---
# 12-nexus-apt.yml — point every managed Ubuntu host's apt at the in-platform
# per-release Nexus repos (ng-apt-jammy-prod / ng-apt-noble-prod).
#
# Replaces the earlier behaviour of this play, which STRIPPED the ng-apt source
# because the only repo then available was a single mixed-release one
# (jammy+noble+plucky in one dist) that broke dependency resolution. The
# platform now publishes per-release proxy repos, so the `nexus_apt` role
# configures the matching one per host (keyed off its codename) with the
# bundled, fingerprint-verified signing key. archive.ubuntu.com is left in
# place as a lower-priority fallback (Eric, 2026-11-19).
#
# Runs before 00-baseline so every later apt install resolves from Nexus.
- name: Configure Nexus per-release apt source on all managed Ubuntu hosts
  hosts: linux:malcolm
  gather_facts: true
  become: true
  tags:
    - nexus_apt
  roles:
    - nexus_apt
