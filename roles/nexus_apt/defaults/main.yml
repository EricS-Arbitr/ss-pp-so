# nexus_apt — point managed Ubuntu hosts at the in-platform Nexus apt repo
# (ng-apt) so role package installs come from Nexus instead of the internet.
#
# Nexus is reachable ONLY through the mgmt proxy and presents an internal-CA
# cert, so this routes the Nexus host through the proxy and skips TLS
# verification, and marks the repo trusted (GPG handled by trusted=yes). An
# apt-preferences pin makes any package ng-apt carries win over
# archive.ubuntu.com, so what ng-apt has comes from Nexus; archive stays as a
# fallback for anything ng-apt lacks (the base images already carry it) unless
# nexus_apt_disable_upstream is set true for a full cutover.
nexus_apt_url: "https://nexus.dev.ng.simspace.lan/repository/ng-apt/"
nexus_apt_host: "nexus.dev.ng.simspace.lan"
nexus_apt_dist: "simspace"
nexus_apt_component: "main"
nexus_apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
nexus_apt_proxy: "http://{{ inet_proxy_addr }}:{{ inet_proxy_port }}"
# >1000 lets ng-apt win even over a higher archive version. Installed packages
# use state: present so they are not disturbed; this governs NEW installs.
nexus_apt_pin_priority: 1001
# Leave archive.ubuntu.com configured as a fallback (default). Set true to
# disable it for a full zero-internet-apt cutover (relies on ng-apt + base image
# covering every role package -- image-verified for ss-pp-so 2026-10-15).
nexus_apt_disable_upstream: false
nexus_apt_lock_timeout: 600
