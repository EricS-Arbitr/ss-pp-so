# Configure the in-platform Nexus apt repo (ng-apt) as the preferred source.
# Validated on soc-malcolm 2026-10-15: source + proxy + verify-off -> apt-get
# update clean, docker-ce resolves from ng-apt.

- name: Assert supported distribution
  ansible.builtin.assert:
    that: ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: "nexus_apt supports Ubuntu only, got {{ ansible_facts['distribution'] }}"
    quiet: true

- name: Route Nexus through the mgmt proxy and skip internal-CA TLS verify
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99nexus
    content: |
      Acquire::https::Proxy::{{ nexus_apt_host }} "{{ nexus_apt_proxy }}";
      Acquire::http::Proxy::{{ nexus_apt_host }}  "{{ nexus_apt_proxy }}";
      Acquire::https::{{ nexus_apt_host }}::Verify-Peer "false";
      Acquire::https::{{ nexus_apt_host }}::Verify-Host "false";
    owner: root
    group: root
    mode: "0644"
  register: nexus_apt_conf

- name: Write the ng-apt apt source (trusted; GPG handled by trusted=yes)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nexus.list
    content: "deb [arch={{ nexus_apt_arch }} trusted=yes] {{ nexus_apt_url }} {{ nexus_apt_dist }} {{ nexus_apt_component }}\n"
    owner: root
    group: root
    mode: "0644"
  register: nexus_apt_src

- name: Pin ng-apt above archive.ubuntu.com so Nexus wins
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99-nexus-ng-apt
    content: |
      Package: *
      Pin: origin "{{ nexus_apt_host }}"
      Pin-Priority: {{ nexus_apt_pin_priority }}
    owner: root
    group: root
    mode: "0644"
  register: nexus_apt_pin

# Optional full cutover: disable archive.ubuntu.com so even apt-get update makes
# no internet request. Off by default -- archive stays as a fallback.
- name: Disable archive.ubuntu.com sources (full cutover)
  when: nexus_apt_disable_upstream | bool
  block:
    - name: Comment out deb lines in /etc/apt/sources.list (jammy layout)
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: '^(deb(?:-src)?\s)'
        replace: '# \1'
      failed_when: false

    - name: Disable the DEB822 ubuntu.sources (noble layout)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/ubuntu.sources.disabled
        src: /etc/apt/sources.list.d/ubuntu.sources
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      failed_when: false
      register: nexus_apt_noble_backup

    - name: Remove the active ubuntu.sources (noble layout)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/ubuntu.sources
        state: absent
      when: nexus_apt_noble_backup is changed

- name: Refresh apt cache with ng-apt as the preferred source
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: "{{ nexus_apt_lock_timeout }}"
  when: nexus_apt_conf is changed or nexus_apt_src is changed or nexus_apt_pin is changed
