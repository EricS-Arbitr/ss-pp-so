# NEXUS SOURCING (2026-10-15): when true, install Docker CE from the in-platform
# Nexus apt repo (ng-apt, dist=simspace comp=main) instead of download.docker.com.
# docker-ce/-cli/containerd.io/buildx/compose are all present in ng-apt. Nexus is
# reached ONLY via the mgmt proxy and presents an internal-CA cert, so this writes
# the ng-apt source (trusted=yes) + a proxy/verify-off apt drop-in and SKIPS the
# download.docker.com key + repo. Set per-host/group (e.g. group_vars/malcolm.yml).
docker_engine_use_nexus_apt: false
docker_engine_nexus_apt_url: "https://nexus.dev.ng.simspace.lan/repository/ng-apt/"
docker_engine_nexus_apt_dist: "simspace"
docker_engine_nexus_apt_component: "main"
docker_engine_nexus_apt_host: "nexus.dev.ng.simspace.lan"
docker_engine_nexus_apt_proxy: "http://{{ inet_proxy_addr }}:{{ inet_proxy_port }}"

# Docker's upstream apt repo. Point these at a local mirror for air-gapped use.
docker_engine_repo_url: https://download.docker.com/linux/ubuntu
docker_engine_gpg_key_url: "{{ docker_engine_repo_url }}/gpg"
docker_engine_repo_suite: "{{ ansible_facts['distribution_release'] }}"
docker_engine_repo_components: stable
docker_engine_repo_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
docker_engine_keyring: /etc/apt/keyrings/docker.asc

docker_engine_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Distro packages that conflict with Docker CE.
docker_engine_conflicting_packages:
  - docker.io
  - docker-doc
  - docker-compose
  - docker-compose-v2
  - podman-docker
  - containerd
  - runc

# Seconds to wait for the apt/dpkg lock (PackageKit, unattended-upgrades).
docker_engine_apt_lock_timeout: 600

# Written to /etc/docker/daemon.json.
docker_engine_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: 50m
    max-file: "3"

# Users added to the docker group. Group membership takes effect on the
# user's next login / SSH connection.
docker_engine_users: []

# HTTP(S) proxy for Docker image pulls (written as a docker.service systemd
# drop-in). Empty = no proxy drop-in. On ss-pp-so set this to the in-platform
# proxy so `docker pull ghcr.io/...` works in the zero-egress range.
docker_engine_proxy: ""
docker_engine_no_proxy: "localhost,127.0.0.1"
