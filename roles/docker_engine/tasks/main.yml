- name: Assert supported distribution
  ansible.builtin.assert:
    that: ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: "docker_engine supports Ubuntu only, got {{ ansible_facts['distribution'] }}"
    quiet: true

- name: Remove conflicting distro packages
  ansible.builtin.apt:
    name: "{{ docker_engine_conflicting_packages }}"
    state: absent
    lock_timeout: "{{ docker_engine_apt_lock_timeout }}"

- name: Install repo prerequisites
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    cache_valid_time: 3600
    lock_timeout: "{{ docker_engine_apt_lock_timeout }}"

# --- NEXUS SOURCING: Docker CE from the in-platform ng-apt repo ------------
# When docker_engine_use_nexus_apt is true, configure the ng-apt source (routed
# through the mgmt proxy, internal-CA TLS skipped) and skip the download.docker.com
# key + repo below. docker-ce and friends install from ng-apt instead.
- name: Configure Nexus ng-apt source for Docker CE
  when: docker_engine_use_nexus_apt | bool
  block:
    - name: Write ng-apt apt source (trusted; GPG handled by trusted=yes)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nexus.list
        content: >-
          deb [arch={{ docker_engine_repo_arch }} trusted=yes]
          {{ docker_engine_nexus_apt_url }}
          {{ docker_engine_nexus_apt_dist }}
          {{ docker_engine_nexus_apt_component }}
        owner: root
        group: root
        mode: "0644"
      register: docker_engine_nexus_src

    - name: Route Nexus through the mgmt proxy and skip internal-CA TLS verify
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99nexus
        content: |
          Acquire::https::Proxy::{{ docker_engine_nexus_apt_host }} "{{ docker_engine_nexus_apt_proxy }}";
          Acquire::http::Proxy::{{ docker_engine_nexus_apt_host }}  "{{ docker_engine_nexus_apt_proxy }}";
          Acquire::https::{{ docker_engine_nexus_apt_host }}::Verify-Peer "false";
          Acquire::https::{{ docker_engine_nexus_apt_host }}::Verify-Host "false";
        owner: root
        group: root
        mode: "0644"
      register: docker_engine_nexus_conf

- name: Create apt keyrings directory
  ansible.builtin.file:
    path: "{{ docker_engine_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not docker_engine_use_nexus_apt | bool

- name: Download Docker apt signing key
  ansible.builtin.get_url:
    url: "{{ docker_engine_gpg_key_url }}"
    dest: "{{ docker_engine_keyring }}"
    owner: root
    group: root
    mode: "0644"
  register: docker_engine_key
  when: not docker_engine_use_nexus_apt | bool

- name: Add Docker apt repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  register: docker_engine_repo
  when: not docker_engine_use_nexus_apt | bool

- name: Refresh apt cache after repo change # noqa: no-handler
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: "{{ docker_engine_apt_lock_timeout }}"
  when: >-
    (docker_engine_key.changed | default(false)) or
    (docker_engine_repo.changed | default(false)) or
    (docker_engine_nexus_src.changed | default(false)) or
    (docker_engine_nexus_conf.changed | default(false))

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: "{{ docker_engine_packages }}"
    state: present
    cache_valid_time: 3600
    lock_timeout: "{{ docker_engine_apt_lock_timeout }}"

- name: Configure Docker daemon
  ansible.builtin.copy:
    content: "{{ docker_engine_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

# Image pulls (ghcr.io) go through the proxy in a zero-egress range. The daemon
# reads HTTPS_PROXY from a systemd drop-in, not daemon.json. Written before the
# first start so the initial pull already uses it.
- name: Create docker.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_engine_proxy | length > 0

- name: Configure Docker daemon proxy for image pulls
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    content: |
      # Managed by Ansible (docker_engine)
      [Service]
      Environment="HTTP_PROXY={{ docker_engine_proxy }}"
      Environment="HTTPS_PROXY={{ docker_engine_proxy }}"
      Environment="NO_PROXY={{ docker_engine_no_proxy }}"
    owner: root
    group: root
    mode: "0644"
  when: docker_engine_proxy | length > 0
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - containerd
    - docker

# apt auto-starts docker on install, BEFORE the proxy drop-in is written, so the
# running daemon has no HTTPS_PROXY and image pulls try to resolve ghcr.io
# directly -- which fails in a zero-egress range ("lookup ghcr.io ... server
# misbehaving"). A notified restart fires too late (after the pull) and not at
# all on a re-run where the drop-in is unchanged but the live daemon still lacks
# it. Inspect the RUNNING dockerd's own environment and restart only when the
# proxy is genuinely absent -- this unsticks that state without ever needlessly
# bouncing a healthy daemon (which would stop Malcolm's containers).
- name: Check whether the running dockerd already has the proxy
  ansible.builtin.shell: |
    set -o pipefail
    pid=$(systemctl show -p MainPID --value docker)
    if [ -n "$pid" ] && [ "$pid" != "0" ] && tr '\0' '\n' < "/proc/$pid/environ" | grep -qx "HTTPS_PROXY={{ docker_engine_proxy }}"; then
      echo HAVE
    else
      echo MISSING
    fi
  args:
    # pipefail (and the pipe) need bash; the shell module defaults to /bin/sh
    # (dash on Ubuntu), which errors with "Illegal option -o pipefail".
    executable: /bin/bash
  register: docker_engine_proxy_live
  changed_when: false
  when: docker_engine_proxy | length > 0

- name: Restart Docker to apply the proxy (only when the live daemon lacks it)
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    daemon_reload: true
  when:
    - docker_engine_proxy | length > 0
    - "'MISSING' in (docker_engine_proxy_live.stdout | default('MISSING'))"

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_engine_users }}"
