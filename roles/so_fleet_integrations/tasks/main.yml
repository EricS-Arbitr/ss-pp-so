---
# =========================================================================
# so_fleet_integrations — create host-scoped Fleet policies + integrations
# =========================================================================
# Runs on so-manager. See defaults/main.yml for why dedicated policies and
# why we call the Fleet API rather than SO's loader.
#
# Every API call goes through so-elastic-fleet-common's fleet_api(), which
# uses /opt/so/conf/elasticsearch/curl.config for auth -- the same mechanism
# defend_exclusions.yml already uses. No credentials in vault, nothing for us
# to rotate.
# =========================================================================

- name: Preflight — confirm this role is running with escalated privilege
  ansible.builtin.command: id -u
  register: _fleet_euid
  changed_when: false

- name: Fail immediately if so_fleet_integrations was invoked without become
  ansible.builtin.fail:
    msg: >-
      so_fleet_integrations must run with become: true — every task reads
      /opt/so/conf/elasticsearch/curl.config, which is root-only.
  when: (_fleet_euid.stdout | trim) != '0'

- name: Ensure our integration JSON directory exists
  ansible.builtin.file:
    path: "{{ so_fleet_json_dir }}/{{ item.policy }}"
    state: directory
    mode: '0750'
    owner: root
    group: root
  loop: "{{ so_fleet_integrations }}"
  loop_control:
    label: "{{ item.policy }}"

- name: Render the integration definition for each policy
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: "{{ so_fleet_json_dir }}/{{ item.policy }}/{{ item.name }}.json"
    mode: '0640'
    owner: root
    group: root
  loop: "{{ so_fleet_integrations }}"
  loop_control:
    label: "{{ item.name }}"

# --- Agent policies -------------------------------------------------------
# elastic_fleet_policy_create sets id == name, so the policy id is
# deterministic and existence is a plain string match. No lookup table.
- name: Create the dedicated agent policy if it does not exist
  ansible.builtin.shell: |
    . /usr/sbin/so-elastic-fleet-common
    if elastic_fleet_agent_policy_ids | grep -qxF "{{ item.policy }}"; then
      echo "POLICY_EXISTS {{ item.policy }}"
    elif elastic_fleet_policy_create "{{ item.policy }}" "{{ item.description }}" "false" "{{ so_fleet_policy_timeout }}" > /dev/null; then
      echo "POLICY_CREATED {{ item.policy }}"
    else
      echo "POLICY_FAILED {{ item.policy }}"
    fi
  args:
    executable: /bin/bash
  register: so_fleet_policy
  changed_when: "'POLICY_CREATED' in so_fleet_policy.stdout"
  failed_when: "'POLICY_FAILED' in so_fleet_policy.stdout"
  loop: "{{ so_fleet_integrations }}"
  loop_control:
    label: "{{ item.policy }}"

# --- Integrations ---------------------------------------------------------
# check then create-or-update, mirroring what SO's own loader does for its
# hardcoded directories. Idempotent: a re-run updates in place.
- name: Attach the integration to its policy
  ansible.builtin.shell: |
    . /usr/sbin/so-elastic-fleet-common
    JSON="{{ so_fleet_json_dir }}/{{ item.policy }}/{{ item.name }}.json"
    elastic_fleet_integration_check "{{ item.policy }}" "$JSON"
    if [ -n "$INTEGRATION_ID" ]; then
      if elastic_fleet_integration_update "$INTEGRATION_ID" "@$JSON" > /dev/null; then
        echo "INTEGRATION_UPDATED {{ item.name }}"
      else
        echo "INTEGRATION_FAILED {{ item.name }}"
      fi
    elif elastic_fleet_integration_create "@$JSON" > /dev/null; then
      echo "INTEGRATION_CREATED {{ item.name }}"
    else
      echo "INTEGRATION_FAILED {{ item.name }}"
    fi
  args:
    executable: /bin/bash
  register: so_fleet_integration
  changed_when: "'INTEGRATION_CREATED' in so_fleet_integration.stdout"
  failed_when: "'INTEGRATION_FAILED' in so_fleet_integration.stdout"
  loop: "{{ so_fleet_integrations }}"
  loop_control:
    label: "{{ item.name }}"

# --- Move the target hosts onto their policy ------------------------------
# Enrolment puts every endpoint on endpoints-initial, because the token baked
# into SO's installer decides the policy. Reassignment is the supported way
# to move one afterwards. Idempotent: we compare the current policy first.
- name: Reassign the target host onto its dedicated policy
  ansible.builtin.shell: |
    . /usr/sbin/so-elastic-fleet-common
    WANT="{{ item.1 }}"
    # The kuery VALUE MUST be quoted (%22). Unquoted, KQL tokenises on the
    # hyphen, so hostname:pp-www also matches pp-proxy and pp-syslog -- and
    # taking [0] then picks an arbitrary one. On 2026-09-09 that
    # cross-assigned the two hosts: pp-www landed on so-proxy and never ran
    # the nginx input, which surfaced ten minutes later as DATA_NONE with
    # nothing visibly wrong at either end.
    #
    # The jq select() is the real guard, not the quoting. A lookup that CAN
    # return the wrong host must be made to prove it returned the right one,
    # so we match the hostname exactly rather than trusting the query.
    AID=$(fleet_api "agents?kuery=local_metadata.host.hostname:%22$WANT%22" \
          | jq -r --arg h "$WANT" '(.items // .list)[]
              | select(((.local_metadata.host.hostname // "") | ascii_downcase) == ($h | ascii_downcase))
              | .id' | head -1)
    if [ -z "$AID" ]; then
      echo "AGENT_NOT_FOUND $WANT"
      exit 0
    fi
    # Re-read the agent and confirm identity before mutating it.
    GOT=$(fleet_api "agents/$AID" | jq -r ".item.local_metadata.host.hostname // empty")
    if [ "$(echo "$GOT" | tr A-Z a-z)" != "$(echo "$WANT" | tr A-Z a-z)" ]; then
      echo "AGENT_MISMATCH wanted=$WANT got=$GOT id=$AID"
      exit 0
    fi
    CUR=$(fleet_api "agents/$AID" | jq -r ".item.policy_id // empty")
    if [ "$CUR" = "{{ item.0.policy }}" ]; then
      echo "ALREADY_ASSIGNED {{ item.1 }}"
    elif fleet_api "agents/$AID/reassign" -XPOST -H "kbn-xsrf: true" -H "Content-Type: application/json" -d "{\"policy_id\":\"{{ item.0.policy }}\"}" > /dev/null; then
      echo "REASSIGNED {{ item.1 }} -> {{ item.0.policy }}"
    else
      echo "REASSIGN_FAILED {{ item.1 }}"
    fi
  args:
    executable: /bin/bash
  register: so_fleet_reassign
  changed_when: "'REASSIGNED' in so_fleet_reassign.stdout"
  failed_when: >-
    'REASSIGN_FAILED' in so_fleet_reassign.stdout
    or 'AGENT_NOT_FOUND' in so_fleet_reassign.stdout
    or 'AGENT_MISMATCH' in so_fleet_reassign.stdout
  loop: "{{ so_fleet_integrations | subelements('hosts') }}"
  loop_control:
    label: "{{ item.1 }} -> {{ item.0.policy }}"

# --- Seed traffic so verification does not depend on luck -----------------
# On the 2026-09-10 fresh build these datasets verified on 2 and 4 documents
# -- whatever incidental traffic happened to cross the range during the
# 10-minute wait. User emulation is not running yet at this point in the
# deploy, so a quieter build would have produced zero and hard-failed the
# LAST phase of a five-hour run.
#
# Generating the traffic ourselves removes the dependence on ambient
# activity, and unlike downgrading the check to a warning it still proves
# the whole path works: request -> log line -> agent -> ingest pipeline ->
# parsed document.
#
# Deliberately tolerant. A seed that fails is not itself a deploy failure;
# the verify step below is the judge. wget over curl (Eric, 2026-09-10).
- name: Seed traffic so the verify step does not depend on ambient activity
  ansible.builtin.shell: |
    if ! command -v wget > /dev/null 2>&1; then
      echo "SEED_SKIPPED wget not present on {{ item.seed.host }}"
      exit 0
    fi
    ok=0
    {% for r in item.seed.requests %}
    if wget {{ so_fleet_seed_opts }} {{ r }} > /dev/null 2>&1; then ok=$((ok+1)); fi
    {% endfor %}
    echo "SEEDED {{ item.seed.host }} $ok/{{ item.seed.requests | length }}"
  args:
    executable: /bin/bash
  delegate_to: "{{ item.seed.host }}"
  register: so_fleet_seed
  changed_when: false
  failed_when: false
  loop: "{{ so_fleet_integrations }}"
  loop_control:
    label: "{{ item.seed.host }}"

- name: Report what was seeded
  ansible.builtin.debug:
    msg: "{{ so_fleet_seed.results | map(attribute='stdout') | list }}"

# --- Proof, not an exit code ---------------------------------------------
# An integration can create cleanly, attach cleanly, and collect NOTHING --
# a wrong input or stream id in defaults/main.yml produces exactly that, and
# every 200 along the way still says success.
#
# We assert a PARSED FIELD, not a document count. A count only proves bytes
# arrived: if the log format does not match what the ingest pipeline expects,
# documents still land, they just have no usable fields. That is the squid
# trap in particular -- the integration wants squid`s native format, and
# feeding it something else yields a full index of unqueryable rows. Asking
# for url.path / source.ip proves the pipeline actually understood the data.
#
# Retries because the agent has to check in, receive the new policy and start
# collecting before anything can land.
- name: Wait for PARSED documents to arrive in each dataset
  ansible.builtin.shell: |
    n=$(so-elasticsearch-query "{{ item.verify_datastream }}/_search?q={{ item.verify_field }}:*&size=0&filter_path=hits.total" 2>/dev/null | grep -o "\"value\":[0-9]*" | head -1 | cut -d: -f2)
    if [ -n "$n" ] && [ "$n" -gt 0 ]; then echo "DATA_OK {{ item.verify_datastream }} {{ item.verify_field }}=$n"; else echo "DATA_NONE {{ item.verify_datastream }}"; fi
  args:
    executable: /bin/bash
  register: so_fleet_data
  until: "'DATA_OK' in so_fleet_data.stdout"
  retries: "{{ so_fleet_verify_retries }}"
  delay: 30
  changed_when: false
  ignore_errors: true
  loop: "{{ so_fleet_integrations }}"
  loop_control:
    label: "{{ item.verify_datastream }}"

- name: Fail if any integration produced no data
  ansible.builtin.fail:
    msg: |
      These integrations attached successfully but collected nothing:
        {{ dead | map(attribute='item.name') | join(', ') }}

      The API accepted every call, so the fault is in WHAT was asked for,
      not whether it was asked. Check, in order:
        1. input / stream ids in so_fleet_integrations (defaults/main.yml).
           Confirm against the grid:
             . /usr/sbin/so-elastic-fleet-common
             fleet_api "epm/packages/<pkg>" | jq -r '.item.data_streams[]
               | "\(.dataset)  input=\(.streams[0].input)"'
        2. the source is actually sending. nginx: the paths exist and are
           readable by the elastic-agent user. squid: squid.conf carries
           `access_log udp://127.0.0.1:9537 squid` and squid was reloaded.
        2b. the FORMAT matches. Documents with no parsed fields mean the
           ingest pipeline did not recognise the input -- check a raw doc.
        3. the host actually moved policy — so-elastic-fleet-agent-policy-view
           <policy> should list it.
  vars:
    dead: "{{ so_fleet_data.results | rejectattr('stdout', 'search', 'DATA_OK') | list }}"
  when: dead | length > 0

- name: Report
  ansible.builtin.debug:
    msg: >-
      Fleet integrations live:
      {{ so_fleet_data.results | map(attribute='stdout') | select('search', 'DATA_OK') | list }}
