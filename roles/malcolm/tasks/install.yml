- name: Install control-script prerequisites (incl. git for the clone)
  ansible.builtin.apt:
    name:
      - git
      - python3-dotenv
      - python3-requests
      - python3-ruamel.yaml
      - openssl
      - apache2-utils
    state: present
    cache_valid_time: 3600
    lock_timeout: "{{ malcolm_apt_lock_timeout }}"

- name: Create Malcolm group
  ansible.builtin.group:
    name: "{{ malcolm_group }}"
    system: true

- name: Create Malcolm service user
  ansible.builtin.user:
    name: "{{ malcolm_user }}"
    group: "{{ malcolm_group }}"
    groups: docker
    append: true
    system: true
    home: "{{ malcolm_home }}"
    create_home: true
    shell: /usr/sbin/nologin
  register: malcolm_user_info

- name: Record Malcolm UID/GID
  ansible.builtin.set_fact:
    malcolm_uid: "{{ malcolm_user_info.uid }}"
    malcolm_gid: "{{ malcolm_user_info.group }}"

- name: Create install directory
  ansible.builtin.file:
    path: "{{ malcolm_install_dir }}"
    state: directory
    owner: "{{ malcolm_user }}"
    group: "{{ malcolm_group }}"
    mode: "0750"

# THIS ITERATION clones the Malcolm source straight from GitHub through the
# proxy (the play sets http(s)_proxy, which git honours for https remotes),
# pinned to the release tag. A later air-gapped pass would point
# malcolm_repo_url at a local mirror instead. Untracked files the role creates
# later (config/*.env, nginx certs) do not block a same-tag re-clone.
- name: Clone the Malcolm source at the pinned release tag
  ansible.builtin.git:
    repo: "{{ malcolm_repo_url }}"
    dest: "{{ malcolm_install_dir }}"
    version: "{{ malcolm_repo_version }}"
    depth: 1
    force: false
  register: malcolm_clone

- name: Ensure the install tree is owned by the Malcolm user
  ansible.builtin.file:
    path: "{{ malcolm_install_dir }}"
    state: directory
    owner: "{{ malcolm_user }}"
    group: "{{ malcolm_group }}"
    recurse: true
  when: malcolm_clone is changed

- name: Confirm the clone produced a Malcolm tree
  ansible.builtin.stat:
    path: "{{ malcolm_install_dir }}/docker-compose.yml"
  register: malcolm_compose_stat

- name: Fail if docker-compose.yml is missing after the clone
  ansible.builtin.fail:
    msg: >-
      {{ malcolm_install_dir }}/docker-compose.yml not found after cloning
      {{ malcolm_repo_url }}@{{ malcolm_repo_version }}.
  when: not malcolm_compose_stat.stat.exists

- name: Point images at the configured registry (no-op on the default)
  ansible.builtin.replace:
    path: "{{ malcolm_install_dir }}/docker-compose.yml"
    regexp: 'image: {{ malcolm_image_registry_default | regex_escape }}/'
    replace: "image: {{ malcolm_image_registry }}/"
  when: malcolm_image_registry != malcolm_image_registry_default
